name: IOSModMenuLab

options:
  bundleIdPrefix: com.giosgame11
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  IOSModMenuLab:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.giosgame11.iosmodmenulab
        PRODUCT_NAME: IOSModMenuLab
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: IOSModMenuLab
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
